{{ define "title" }}
  {{ .Title }} · {{ .Site.Title }}
{{ end }}
{{ define "content" }}
  <section class="container list">
    <header>
      <h1 class="title">
        <a class="title-link" href="{{ .Permalink | safeURL }}">{{ .Title }}</a>
      </h1>
    </header>
    {{ .Content }}
    <ul class="timeline" aria-label="Speaking engagements">
      {{ range .Pages.ByWeight }}
      <li class="timeline-item">
        <h2>{{ .Title }}</h2>
        <p class="timeline-role">{{ .Params.event }}</p>
        <p class="timeline-date">{{ .Params.venue }} · <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2 January 2006" }}</time></p>
      </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
